databaseChangeLog:
  - changeSet:
      id: 001-create-migration-execution-tmp
      author: Frank
      changes:
        - createTable:
            tableName: migration_execution_tmp
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_migration_execution_tmp
                    nullable: false
              - column:
                  name: execution_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_migration_execution_tmp_execution_id
              - column:
                  name: migration_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: migration_description
                  type: TEXT
              - column:
                  name: migration_version
                  type: VARCHAR(50)
              - column:
                  name: executed_by
                  type: VARCHAR(255)
              - column:
                  name: start_time
                  type: TIMESTAMP
              - column:
                  name: end_time
                  type: TIMESTAMP
              - column:
                  name: duration_ms
                  type: BIGINT
              - column:
                  name: total_tables
                  type: INT
              - column:
                  name: successful_tables
                  type: INT
              - column:
                  name: failed_tables
                  type: INT
              - column:
                  name: blocked_tables
                  type: INT
              - column:
                  name: status
                  type: VARCHAR(50)

  - changeSet:
      id: 002-create-table-execution-tmp
      author: Frank
      changes:
        - createTable:
            tableName: table_execution_tmp
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_table_execution_tmp
                    nullable: false
              - column:
                  name: migration_execution_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: table_execution_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_table_execution_tmp_table_execution_id
              - column:
                  name: source_schema
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: source_table
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: target_schema
                  type: VARCHAR(255)
              - column:
                  name: target_table
                  type: VARCHAR(255)
              - column:
                  name: execution_order
                  type: INT
              - column:
                  name: migration_type
                  type: VARCHAR(50)
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: records_processed
                  type: BIGINT
              - column:
                  name: start_time
                  type: TIMESTAMP
              - column:
                  name: end_time
                  type: TIMESTAMP
              - column:
                  name: duration_ms
                  type: BIGINT
              - column:
                  name: incremental_column
                  type: VARCHAR(255)
              - column:
                  name: last_processed_value
                  type: VARCHAR(255)
              - column:
                  name: where_clause
                  type: TEXT
        - addForeignKeyConstraint:
            baseTableName: table_execution_tmp
            baseColumnNames: migration_execution_id
            referencedTableName: migration_execution_tmp
            referencedColumnNames: id
            constraintName: fk_table_execution_tmp_migration_execution_tmp

  - changeSet:
      id: 003-create-table-transformation-rule-tmp
      author: Frank
      changes:
        - createTable:
            tableName: table_transformation_rule_tmp
            columns:
              - column:
                  name: id
