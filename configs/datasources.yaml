# ═══════════════════════════════════════════════════════════════════════════
#  Configuración de conexiones JDBC a las bases de datos.
#  Fichero: datasources.yaml
#
#  Seguridad:
#  - Las credenciales se resuelven desde variables de entorno.
#  - Puedes usar la sintaxis ${VAR} o ${VAR:valor_por_defecto}.
#  - No se guardan contraseñas reales en este fichero.
# ═══════════════════════════════════════════════════════════════════════════

source:
  driver: ${SOURCE_DB_DRIVER:org.postgresql.Driver}
  jdbcUrl: ${SOURCE_DB_JDBC_URL}
  username: ${SOURCE_DB_USERNAME}
  password: ${SOURCE_DB_PASSWORD}

target:
  driver: ${TARGET_DB_DRIVER:org.postgresql.Driver}
  jdbcUrl: ${TARGET_DB_JDBC_URL}
  username: ${TARGET_DB_USERNAME}
  password: ${TARGET_DB_PASSWORD}
