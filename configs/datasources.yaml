# ═══════════════════════════════════════════════════════════════════════════
#  Configuración de conexiones JDBC a las bases de datos.
#  Fichero: datasources.yaml
#
#  Define los parámetros de conexión para las bases de datos de origen
#  y destino utilizadas durante la migración. Modifica las URLs,
#  usuarios y contraseñas según tu entorno.
# ═══════════════════════════════════════════════════════════════════════════

source:
  driver: org.postgresql.Driver
  jdbcUrl: jdbc:postgresql://postgres-source:5432/source_db
  username: source_user
  password: source_password

target:
  driver: org.postgresql.Driver
  jdbcUrl: jdbc:postgresql://postgres-target:5432/target_db
  username: target_user
  password: target_password
