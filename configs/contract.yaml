migration:
  name: "nombre_migracion"
  description: "descripcion_de_la_migracion"
  version: "x.x"
  author: "nombre_del_autor"

tables:
  tabla_full:
    source:
      schema: "nombre_esquema_origen"
      table: "nombre_tabla_origen"
    target:
      schema: "nombre_esquema_destino"
      table: "nombre_tabla_destino"
    enabled: true
    migrationType: "full"
    filters:
      where: "condicion SQL opcional"

  tabla_incremental:
    source:
      schema: "nombre_esquema_origen"
      table: "nombre_tabla_origen"
    target:
      schema: "nombre_esquema_destino"
      table: "nombre_tabla_destino"
    enabled: true
    migrationType: "incremental"
    incrementalConfig:
      column: "nombre_columna_referencia"
      startValue: "valor_de_inicio"
      batchSize: numero_registros_migrar
      loadStrategy: "upsert/append/append_only"
      idempotencyKeyColumns:
        - "columna_clave_idempotencia"
    filters:
      where: "condicion SQL opcional"
