migration:
  name: migracion_relacional_demo
  description: "Migración de varias tablas entre esquemas..."
  version: 0.1
  author: ${USERNAME}

liquibase:
  changelog: classpath:/db/changelog/changelog-master.yaml
  contexts: "production"

tables:
  nombre_tabla_1:
    source:
      schema: nombre_esquema
      table: nombre_tabla
    target:
      schema: nombre_esquema
      table: nombre_tabla
    enabled: true
    migrationType: full
    incrementalConfig:
      column: fecha_creacion
      type: timestamp
      startValue: "2026-01-01T00:00:00"
      batchSize: 1000
    filters:
      where: "condicion SQL"
    transformations:
      columns:
        nombre_columna:
          rename: nuevo_nombre
          type: tipo_destino
          trim: true
          nullDefault: valor
          case: uppercase
