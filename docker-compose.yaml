x-nifi-api-url: &nifi_api_url https://nifi:8443/nifi-api

services:
  topomigrator:
    build: .
    depends_on:
      nifi:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs
      - ./flows:/app/flows
      - ./outputs:/app/outputs
      - ./changelogs:/app/changelogs
    environment:
      NIFI_BASE_URL: *nifi_api_url
      NIFI_USERNAME: ${NIFI_USERNAME:?NIFI_USERNAME no configurado}
      NIFI_PASSWORD: ${NIFI_PASSWORD:?NIFI_PASSWORD no configurado}
      MIGRATION_CONFIG_PATH: /app/configs/contract.yaml
      DATASOURCES_CONFIG_PATH: /app/configs/datasources.yaml
      INCREMENTAL_STATE_PATH: /app/outputs/state/incremental-state.json
      NIFI_ALLOW_INSECURE_LOCAL_TLS: "true"
      SOURCE_DB_JDBC_URL: ${SOURCE_DB_JDBC_URL:?SOURCE_DB_JDBC_URL no configurado}
      SOURCE_DB_USERNAME: ${SOURCE_DB_USERNAME:?SOURCE_DB_USERNAME no configurado}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD:?SOURCE_DB_PASSWORD no configurado}
      TARGET_DB_JDBC_URL: ${TARGET_DB_JDBC_URL:?TARGET_DB_JDBC_URL no configurado}
      TARGET_DB_USERNAME: ${TARGET_DB_USERNAME:?TARGET_DB_USERNAME no configurado}
      TARGET_DB_PASSWORD: ${TARGET_DB_PASSWORD:?TARGET_DB_PASSWORD no configurado}
    restart: "no"
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - topomigrator-net

  nifi:
    image: apache/nifi:2.9.0
    hostname: nifi
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_WEB_HTTPS_HOST: nifi
      NIFI_WEB_PROXY_HOST: nifi:8443,localhost:8443,127.0.0.1:8443
      NIFI_BASE_URL: *nifi_api_url
      NIFI_HEALTHCHECK_URL: *nifi_api_url
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME:?NIFI_USERNAME no configurado}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:?NIFI_PASSWORD no configurado}
    ports:
      - "8443:8443"
    volumes:
      - ./src/main/resources/db/drivers:/opt/nifi/drivers
      - ./src/main/resources/nifi-logback.xml:/opt/nifi/nifi-current/conf/logback.xml:ro
      - ./scripts/nifi-ready.sh:/opt/nifi/scripts/nifi-ready.sh:ro
      - ./outputs/logs:/opt/nifi/nifi-current/logs
    healthcheck:
      test: ["CMD", "bash", "/opt/nifi/scripts/nifi-ready.sh"]
      interval: 5s
      timeout: 15s
      retries: 24
      start_period: 120s
    restart: "no"
    init: true
    stop_grace_period: 2m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - topomigrator-net

networks:
  topomigrator-net:
    driver: bridge
