# Docker Compose para topomigrator
# Levanta 2 servicios: app principal y Apache NiFi.
# Las bases de datos se configuran externamente en configs/datasources.yaml.
# Uso: docker compose up --build

services:

  # Aplicación principal — se construye desde el Dockerfile del proyecto
  topomigrator:
    build: .
    container_name: topomigrator
    depends_on:
      nifi:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs
      - ./flows:/app/flows
      - ./outputs:/app/outputs
      - ./changelogs:/app/changelogs
    environment:
      # API REST de NiFi (HTTPS obligatorio en 2.x)
      NIFI_BASE_URL: ${NIFI_BASE_URL:-https://nifi:8443/nifi-api}
      NIFI_USERNAME: ${NIFI_USERNAME:?NIFI_USERNAME no configurado}
      NIFI_PASSWORD: ${NIFI_PASSWORD:?NIFI_PASSWORD no configurado}
      MIGRATION_CONFIG_PATH: ${MIGRATION_CONFIG_PATH:-/app/configs/contract.yaml}
      DATASOURCES_CONFIG_PATH: ${DATASOURCES_CONFIG_PATH:-/app/configs/datasources.yaml}
      NIFI_ALLOW_INSECURE_LOCAL_TLS: ${NIFI_ALLOW_INSECURE_LOCAL_TLS:-true}
    restart: on-failure:3
    init: true
    networks:
      - topomigrator-net

  # Apache NiFi 2.x — UI en https://localhost:8443/nifi
  nifi:
    image: apache/nifi:2.9.0
    container_name: nifi
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME:?NIFI_USERNAME no configurado}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:?NIFI_PASSWORD no configurado}
    ports:
      - "8443:8443"
    volumes:
      - ./src/main/resources/db/drivers:/opt/nifi/drivers
      - ./src/main/resources/nifi-logback.xml:/opt/nifi/nifi-current/conf/logback.xml:ro
      - ./outputs/logs:/opt/nifi/nifi-current/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8443'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    restart: unless-stopped
    stop_grace_period: 1m
    networks:
      - topomigrator-net

networks:
  topomigrator-net:
    driver: bridge
