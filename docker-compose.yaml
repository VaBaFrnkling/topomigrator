# Docker Compose para topomigrator
# Levanta 2 servicios: app principal y Apache NiFi.
# Las credenciales deben declararse en un fichero .env local o en variables de entorno del sistema.
# Uso: docker compose up --build

services:

  topomigrator:
    build: .
    container_name: topomigrator
    depends_on:
      nifi:
        condition: service_started
    volumes:
      - ./configs:/app/configs
      - ./flows:/app/flows
      - ./outputs:/app/outputs
      - ./changelogs:/app/changelogs
    environment:
      NIFI_BASE_URL: ${NIFI_BASE_URL:-https://nifi:8443/nifi-api}
      NIFI_USERNAME: ${NIFI_USERNAME:?Define NIFI_USERNAME en .env o en el entorno}
      NIFI_PASSWORD: ${NIFI_PASSWORD:?Define NIFI_PASSWORD en .env o en el entorno}
      NIFI_ALLOW_INSECURE_LOCAL_TLS: ${NIFI_ALLOW_INSECURE_LOCAL_TLS:-false}
      MIGRATION_CONFIG_PATH: /app/configs/contract.yaml
      DATASOURCES_CONFIG_PATH: /app/configs/datasources.yaml
      SOURCE_DB_DRIVER: ${SOURCE_DB_DRIVER:-org.postgresql.Driver}
      SOURCE_DB_JDBC_URL: ${SOURCE_DB_JDBC_URL:?Define SOURCE_DB_JDBC_URL}
      SOURCE_DB_USERNAME: ${SOURCE_DB_USERNAME:?Define SOURCE_DB_USERNAME}
      SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD:?Define SOURCE_DB_PASSWORD}
      TARGET_DB_DRIVER: ${TARGET_DB_DRIVER:-org.postgresql.Driver}
      TARGET_DB_JDBC_URL: ${TARGET_DB_JDBC_URL:?Define TARGET_DB_JDBC_URL}
      TARGET_DB_USERNAME: ${TARGET_DB_USERNAME:?Define TARGET_DB_USERNAME}
      TARGET_DB_PASSWORD: ${TARGET_DB_PASSWORD:?Define TARGET_DB_PASSWORD}
    networks:
      - topomigrator-net

  nifi:
    image: apache/nifi:2.9.0
    container_name: nifi
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME:?Define NIFI_USERNAME en .env o en el entorno}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:?Define NIFI_PASSWORD en .env o en el entorno}
    ports:
      - "8443:8443"
    volumes:
      - ./src/main/resources/db/drivers:/opt/nifi/drivers
      - ./src/main/resources/nifi-logback.xml:/opt/nifi/nifi-current/conf/logback.xml:ro
      - ./outputs/logs:/opt/nifi/nifi-current/logs
    networks:
      - topomigrator-net

networks:
  topomigrator-net:
    driver: bridge
