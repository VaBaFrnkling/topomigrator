databaseChangeLog:
  - changeSet:
      id: 1
      author: topomigrator
      changes:
        - createTable:
            tableName: customers
            schemaName: public
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: phone
                  type: varchar(30)
              - column:
                  name: city
                  type: varchar(100)
              - column:
                  name: country
                  type: varchar(80)
                  defaultValue: "España"
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
